name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]   # Trigger: whenever you push to 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4   # Updated to v4 (Node.js 24 compatible)

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4   # Updated to v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./CRUDAPP   # 👈 Publish the CRUDAPP folder
